# Publishes a static export of the web client to GitHub Pages.
#
# What this can and cannot do: Pages serves files, it does not run Node.js. The Express
# API in apps/api is therefore NOT deployed here, and every screen that needs it — sign
# in, shops, cart, orders, admin — will fail against this build unless you host the API
# somewhere that runs Node and set the API_BASE_URL variable below to its origin.
name: Deploy web client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, mint the Pages deployment token, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; a newer push waits rather than cancelling a
# half-finished publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns the Pages site on and points its source at Actions, rather than
          # relying on the repository setting having been flipped by hand first.
          enablement: true

      - name: Build static export
        working-directory: apps/web
        env:
          NEXT_OUTPUT: export
          # A project site is served from /<repo>, a user or custom-domain site from
          # the root. Ask Pages which it is rather than assuming.
          NEXT_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Optional: set the repository variable API_BASE_URL to the absolute origin of
          # a deployed Express API (e.g. https://hungry-ju-api.onrender.com/api) to give
          # this build a working backend. Left unset, the app has none.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run build

      - name: Disable Jekyll
        # Jekyll drops directories starting with an underscore, which would delete the
        # entire _next asset tree.
        run: touch apps/web/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
